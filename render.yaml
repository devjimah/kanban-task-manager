# Render deployment blueprint for the Kanban Express API.
#
# The client is deployed separately on Vercel (see vercel.json), so this
# blueprint intentionally defines only the API service.
#
# MONGODB_URI is intentionally NOT defined here: it must be set as a secret in
# the Render dashboard, pointing at a MongoDB Atlas replica set. The API uses
# multi-document transactions for task/column moves and ownership transfer, so a
# standalone mongod will fail readiness at startup.
services:
  - type: web
    name: kanban-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm --workspace server run build
    # Delegates to the server workspace's own start script, which knows the
    # emitted entrypoint (dist/server/src/server.js — tsc rootDir is the repo
    # root, so the source tree structure is preserved under dist/).
    startCommand: npm --workspace server run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      # Set to the deployed client origin, e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # The client is hosted on a different site (Vercel) than this API, so the
      # refresh cookie needs SameSite=None; Secure to be sent at all.
      - key: CROSS_SITE_COOKIES
        value: "true"
      # MongoDB Atlas SRV URI including a replica set.
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
